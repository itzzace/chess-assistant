name: Net Size Survey

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/net-survey.yml' ]
  workflow_dispatch:

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - name: Survey Stockfish net sizes by version
        run: |
          for TAG in sf_15 sf_16 sf_16.1 sf_17 sf_17.1 sf_18; do
            echo "============================================================"
            echo "TAG: $TAG"
            rm -rf s
            if git clone --depth 1 --branch "$TAG" https://github.com/official-stockfish/Stockfish.git s 2>/dev/null; then
              echo "  nets referenced:"
              grep -rohE 'nn-[0-9a-f]+\.nnue' s/src | sort -u | sed 's/^/    /'
              cd s/src
              make net >/dev/null 2>&1 || true
              echo "  downloaded .nnue files:"
              ls -la *.nnue 2>/dev/null | awk '{printf "    %s  %.1f MB\n", $NF, $5/1048576}'
              TOTAL=$(du -cb *.nnue 2>/dev/null | tail -1 | cut -f1)
              echo "  total net bytes: $TOTAL ($(echo "scale=1; $TOTAL/1048576" | bc) MB)"
              cd ../..
            else
              echo "  (tag not found / skipped)"
            fi
          done
          echo "============================================================"
          echo "DONE"
